name: smard
version: "1.0.0"
profile: smard            # which connection in profiles.yml to use

model-paths: ["models"]
test-paths: ["tests"]
clean-targets: ["target", "dbt_packages"]

models:
  smard:
    staging:
      +materialized: view   # staging = light clean-up, a view is enough
      +schema: staging
    marts:
      +materialized: table  # marts = results the dashboard reads, stored as tables
      +schema: marts